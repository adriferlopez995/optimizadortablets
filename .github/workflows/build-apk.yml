name: Compilar APK desde ZIP

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Descomprimir el proyecto
        run: |
          ls -la
          unzip -q optimizador-tablets.zip -d proyecto
          ls -la proyecto/optimizador-tablets

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Compilar APK firmado
        working-directory: proyecto/optimizador-tablets
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Copiar APK
        run: cp proyecto/optimizador-tablets/app/build/outputs/apk/release/app-release.apk optimizador-tablets.apk

      - uses: actions/upload-artifact@v4
        with:
          name: optimizador-tablets-apk
          path: optimizador-tablets.apk

      - name: Publicar en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Versión ${{ github.run_number }}
          files: optimizador-tablets.apk
